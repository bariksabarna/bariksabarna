<header class="navbar">
  <div class="navbar__inner">
    <a class="navbar__brand" href="{{basePath}}/">
      <img src="{{basePath}}/assets/images/avatar/avatar.png" alt="Illustrated portrait of Sabarna Barik" width="40" height="40">
      <span>{{site_name}}</span>
    </a>
    <nav class="navbar__links" aria-label="Primary">
      {{nav_items}}
    </nav>
    <button class="navbar__toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
  </div>
</header>
<nav class="navbar__mobile" id="mobile-menu" aria-label="Mobile">
  {{nav_items_mobile}}
</nav>
<div class="navbar-spacer" aria-hidden="true"></div>
