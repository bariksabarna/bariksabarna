<footer class="footer">
  <div class="container">
    <div class="footer__grid">
      <div>
        <div class="footer__brand">
          <img src="{{basePath}}/assets/images/avatar/avatar.png" alt="Illustrated portrait of Sabarna Barik" width="40" height="40">
          <span>{{site_name}}</span>
        </div>
        <p class="footer__blurb">Computer Science student building real things to learn, and learning to build better.</p>
      </div>
      <div>
        <h4 class="footer__heading">Quick Links</h4>
        <nav class="footer__links" aria-label="Footer">
          {{footer_links}}
        </nav>
      </div>
      <div>
        <h4 class="footer__heading">Social Media</h4>
        <nav class="footer__links" aria-label="Social media">
          {{footer_socials}}
        </nav>
      </div>
    </div>
    <div class="footer__bottom">
      &copy; {{year}} {{site_name}}. All rights reserved.
    </div>
  </div>
</footer>
