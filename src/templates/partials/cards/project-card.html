<article class="grid-item reveal" data-skills="{{data_skills}}">
  <a class="card" href="{{url}}">
    {{media_block}}
    <div class="card__body">
      <h3 class="card__title">{{title}}</h3>
      <p class="card__text">{{summary}}</p>
      <div class="tags card__footer">
        {{tech_tags}}
      </div>
    </div>
  </a>
</article>
