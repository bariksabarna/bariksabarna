<article class="grid-item reveal">
  <a class="skill-card" href="{{url}}">
    <div class="skill-card__icon" aria-hidden="true">
      {{icon}}
    </div>
    <h3>{{name}}</h3>
    <p>{{topics_preview}}</p>
    <div class="skill-card__topics">{{topic_count}} topic{{topic_plural}} covered</div>
  </a>
</article>
